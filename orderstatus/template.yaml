AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Module 5 - order status polling with EventBridge

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256
    Tracing: Active
  Api:
    TracingEnabled: true

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  RestaurantBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub 'Orders-${AWS::StackName}'

  PollingApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod

  CreateOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/create/
      Handler: create_order.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
      Environment:
        Variables:
          ORDERS_TABLE_NAME: !Ref OrdersTable
      Events:
        CreateOrder:
          Type: Api
          Properties:
            RestApiId: !Ref PollingApi
            Path: /orders
            Method: post

  GetOrderStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/status/
      Handler: get_order_status.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
      Environment:
        Variables:
          ORDERS_TABLE_NAME: !Ref OrdersTable
      Events:
        GetOrderStatus:
          Type: Api
          Properties:
            RestApiId: !Ref PollingApi
            Path: /orders/{orderId}
            Method: get

  UpdateOrderStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/update/
      Handler: update_order_status.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
      Environment:
        Variables:
          ORDERS_TABLE_NAME: !Ref OrdersTable
      Events:
        OrderUpdate:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref RestaurantBus
            Pattern:
              source:
                - restaurant
              detail-type:
                - order.updated

Outputs:
  PollingApiEndpoint:
    Description: API Gateway base URL
    Value: !Sub 'https://${PollingApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  RestaurantBusName:
    Description: Restaurant EventBridge bus
    Value: !Ref RestaurantBus
  OrdersTableName:
    Description: Orders DynamoDB table
    Value: !Ref OrdersTable
