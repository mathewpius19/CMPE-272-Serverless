AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Module 4 - asynchronous invocation with EventBridge and SQS

Globals:
  Function:
    Runtime: python3.12
    Timeout: 20
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: userprofile
  Api:
    TracingEnabled: true

Resources:
  UserProfileApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod

  UserAddressesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: addressId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: addressId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  FavoritesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: restaurantId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: restaurantId
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  AddressBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub 'Address-${AWS::StackName}'

  FavoriteDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  FavoriteRestaurantsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FavoriteDeadLetterQueue.Arn
        maxReceiveCount: 3

  PublishAddressFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/address/publish/
      Handler: publish_address.lambda_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: events:PutEvents
              Resource: !GetAtt AddressBus.Arn
      Environment:
        Variables:
          EVENT_BUS_NAME: !Ref AddressBus
      Events:
        AddAddress:
          Type: Api
          Properties:
            RestApiId: !Ref UserProfileApi
            Path: /addresses
            Method: post
        EditAddress:
          Type: Api
          Properties:
            RestApiId: !Ref UserProfileApi
            Path: /addresses/{addressId}
            Method: put
        DeleteAddress:
          Type: Api
          Properties:
            RestApiId: !Ref UserProfileApi
            Path: /addresses/{addressId}
            Method: delete

  ProcessAddressFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/address/process/
      Handler: process_address.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserAddressesTable
      Environment:
        Variables:
          TABLE_NAME: !Ref UserAddressesTable
      Events:
        AddressEvents:
          Type: EventBridgeRule
          Properties:
            EventBusName: !Ref AddressBus
            Pattern:
              source:
                - customer-profile
              detail-type:
                - address.added
                - address.updated
                - address.deleted

  ListAddressesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/address/list/
      Handler: list_addresses.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UserAddressesTable
      Environment:
        Variables:
          TABLE_NAME: !Ref UserAddressesTable
      Events:
        ListAddresses:
          Type: Api
          Properties:
            RestApiId: !Ref UserProfileApi
            Path: /addresses
            Method: get

  PublishFavoriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/favorites/publish/
      Handler: publish_favorite.lambda_handler
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt FavoriteRestaurantsQueue.QueueName
      Environment:
        Variables:
          QUEUE_URL: !Ref FavoriteRestaurantsQueue
      Events:
        AddFavorite:
          Type: Api
          Properties:
            RestApiId: !Ref UserProfileApi
            Path: /favorites
            Method: post
        DeleteFavorite:
          Type: Api
          Properties:
            RestApiId: !Ref UserProfileApi
            Path: /favorites/{restaurantId}
            Method: delete

  ProcessFavoriteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/favorites/process/
      Handler: process_favorite.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FavoritesTable
      Environment:
        Variables:
          TABLE_NAME: !Ref FavoritesTable
      Events:
        FavoriteQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt FavoriteRestaurantsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  ListFavoritesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/api/favorites/list/
      Handler: list_favorites.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FavoritesTable
      Environment:
        Variables:
          TABLE_NAME: !Ref FavoritesTable
      Events:
        ListFavorites:
          Type: Api
          Properties:
            RestApiId: !Ref UserProfileApi
            Path: /favorites
            Method: get

Outputs:
  UserProfileApiEndpoint:
    Description: API Gateway base URL
    Value: !Sub 'https://${UserProfileApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  AddressBus:
    Description: Address EventBridge bus
    Value: !Ref AddressBus
  AddressTable:
    Description: User addresses table
    Value: !Ref UserAddressesTable
  FavoriteSQSUrl:
    Description: Favorite restaurant SQS queue URL
    Value: !Ref FavoriteRestaurantsQueue
  FavoriteTable:
    Description: User favorites table
    Value: !Ref FavoritesTable
